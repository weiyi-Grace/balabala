spring:
  application:
    name: homework-correction-system
  
  # MySQL数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/homework?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  
  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
      jedis:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
  
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 100MB

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /api

# JWT配置
jwt:
  # Production deployments must provide a strong value through JWT_SECRET.
  secret: ${JWT_SECRET:change-this-development-secret-before-deployment}
  expiration: 86400000  # 24小时

# DeepSeek AI配置
deepseek:
  api:
    # Set DEEPSEEK_API_KEY in the environment; never commit the key.
    key: ${DEEPSEEK_API_KEY:}
    url: https://api.deepseek.com/v1/chat/completions
    model: deepseek-chat
  
  # RAG配置
  rag:
    enabled: true
    chunk-size: 500
    chunk-overlap: 50
    top-k: 5

# 日志配置
logging:
  level:
    com.balabala.homework: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
